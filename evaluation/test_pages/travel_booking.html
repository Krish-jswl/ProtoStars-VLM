<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Travel Booking</title>
<style>body{font-family:sans-serif;max-width:600px;margin:40px auto}label{display:block;margin:8px 0 4px}input{width:100%;padding:6px;box-sizing:border-box}</style></head>
<body>
<h1>Book Flight — Delhi to Mumbai</h1>
<p id="flight-info">Flight AI-302 | Departure: 08:30 | Arrival: 10:45</p>
<h2>Passenger Details</h2>
<label for="pax-name">Passenger Name</label>
<input id="pax-name" type="text" autocomplete="name" value="Rohan Gupta" />
<label for="pax-email">Email</label>
<input id="pax-email" type="email" autocomplete="email" value="rohan.gupta@example.com" />
<label for="pax-phone">Phone</label>
<input id="pax-phone" type="tel" autocomplete="tel" value="+91 99887 76655" />
<label for="pax-passport">Passport Number</label>
<input id="pax-passport" type="text" value="J8765432" />
<h2>Payment</h2>
<label for="travel-card">Card</label>
<input id="travel-card" type="text" autocomplete="cc-number" value="5500 0000 0000 0004" />
<button id="book-btn">Book Now — ₹5,299</button>
<button id="cancel-booking" type="button">Cancel</button>
</body></html>
