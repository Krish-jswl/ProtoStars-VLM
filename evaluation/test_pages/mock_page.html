<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Mock Agent Test Page</title></head>
<body>
  <h1>Privacy Vision Agent Test Page</h1>
  <p>This is public non-sensitive content.</p>

  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="email" placeholder="Enter email" />

  <label for="username">Username</label>
  <input id="username" type="text" autocomplete="username" placeholder="Enter username" />

  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password" />

  <label for="phone">Phone</label>
  <input id="phone" type="tel" placeholder="Phone number" />

  <label for="normal">Notes</label>
  <input id="normal" type="text" placeholder="Normal text" />

  <label for="disabled-input">Disabled</label>
  <input id="disabled-input" type="text" disabled />

  <input id="hidden-input" type="text" style="display:none" />

  <button id="submit-btn">Submit</button>

  <div id="scrollable" style="height:200px;overflow:auto;">
    <p>Item 1</p><p>Item 2</p><p>Item 3</p><p>Item 4</p><p>Item 5</p>
  </div>

  <a id="link1" href="#">Learn More</a>
</body>
</html>
