<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Email Inbox</title>
<style>body{font-family:sans-serif;max-width:700px;margin:40px auto}.email-row{border-bottom:1px solid #ccc;padding:8px 0}.compose{margin-top:20px}</style></head>
<body>
<h1>Inbox</h1>
<div class="email-row" id="email-1">
  <strong>Priya Sharma</strong> &lt;priya.sharma@example.com&gt;
  <span>Re: Project Update</span>
  <p>Hi team, please review the attached docs.</p>
</div>
<div class="email-row" id="email-2">
  <strong>Vikram Patel</strong> &lt;vikram.patel@example.com&gt;
  <span>Meeting Tomorrow</span>
  <p>Let us meet at 3 PM. My number is +91 87654 32109.</p>
</div>
<div class="compose">
  <h2>Compose</h2>
  <label for="to-field">To</label>
  <input id="to-field" type="email" placeholder="recipient@example.com" />
  <label for="subject-field">Subject</label>
  <input id="subject-field" type="text" placeholder="Subject" />
  <label for="body-field">Message</label>
  <textarea id="body-field" rows="4" placeholder="Write your message..."></textarea>
  <button id="send-btn">Send</button>
</div>
</body></html>
